<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morosov — Initialisation</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card" style="max-width:440px;">
    <img src="img/logo.svg" alt="Morosov" class="login-logo">
    <h1 style="font-size:30px;letter-spacing:5px;">INITIALISATION</h1>
    <div class="login-sub">PREMIÈRE CONNEXION</div>
    <p style="font-size:14px;color:var(--muted);margin-top:-10px;">
      Crée le premier compte, grade Fondateur, accès total. Cette page ne doit servir qu'une fois.
    </p>
    <form id="form-setup">
      <div class="field">
        <label>Ton pseudo</label>
        <input type="text" id="s-pseudo" placeholder="Ton pseudo" required>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="s-pass" placeholder="Choisis un mot de passe" required>
      </div>
      <button class="submit" type="submit" style="margin-top:6px;">Initialiser le site</button>
    </form>
    <div class="login-error" id="s-error"></div>
    <div class="login-links"><a href="index.html">Retour à la connexion</a></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  startSnow();
  document.getElementById('form-setup').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('s-error');
    errEl.textContent = '';
    const pseudo = document.getElementById('s-pseudo').value.trim();
    const pass = document.getElementById('s-pass').value;

    try {
      const existing = await db.ref('membres').get();
      if (existing.exists() && Object.keys(existing.val()).length > 0) {
        errEl.textContent = "Le site est déjà initialisé — connecte-toi normalement.";
        return;
      }

      const id = uid();
      await db.ref('membres/' + id).set({
        prenom: pseudo,
        mot_de_passe: pass,
        grade: 'fondateur',
        role: 'admin',
        actif: true
      });
      await db.ref('config').set({
        nom_groupe: 'Morosov',
        taux_action_pct: CONFIG_DEFAUT.taux_action_pct,
        taux_labo: CONFIG_DEFAUT.taux_labo,
        taux_recolte: CONFIG_DEFAUT.taux_recolte,
        blanchiment_taux: CONFIG_DEFAUT.blanchiment_taux,
        quotas: QUOTAS_DEFAUT
      });

      setSession({ id, prenom: pseudo, grade: 'fondateur', role: 'admin' });
      window.location.href = 'pages/dashboard.html';
    } catch (err) {
      errEl.textContent = "Erreur d'initialisation — vérifie ta config Firebase et les règles de la base.";
      console.error(err);
    }
  });
</script>
</body>
</html>
