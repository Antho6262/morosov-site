<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morosov — Mode TV</title>
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<style>
  body{ overflow:hidden; }
  .tv-wrap{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px; position:relative;
  }
  .tv-exit{
    position:fixed; top:20px; right:24px; z-index:50;
  }
  .tv-fullscreen{
    position:fixed; top:20px; left:24px; z-index:50;
  }
  .tv-slide{
    width:100%; max-width:1100px;
    display:none;
    animation:tvfade .8s ease;
    text-align:center;
  }
  .tv-slide.active{ display:block; }
  @keyframes tvfade{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }

  .tv-logo{ width:280px; max-width:60vw; height:auto; object-fit:contain; margin:0 auto 18px; filter:drop-shadow(0 0 26px rgba(77,163,255,.65)); }
  .tv-title{ font-family:'Russo One',sans-serif; font-size:64px; color:var(--gold); text-shadow:0 4px 0 rgba(0,0,0,.6), 0 12px 24px rgba(0,0,0,.5); }
  .tv-sub{ font-family:'Barlow Condensed',sans-serif; font-size:18px; letter-spacing:6px; color:var(--muted); margin-top:6px; }

  .tv-h{ font-family:'Russo One',sans-serif; font-size:42px; color:var(--gold); margin-bottom:36px; }
  .tv-podium{ display:flex; justify-content:center; align-items:flex-end; gap:40px; }
  .tv-podium .p{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .tv-podium .medal{ font-size:64px; }
  .tv-podium .name{ font-family:'Barlow',sans-serif; font-size:26px; color:var(--cream); }
  .tv-podium .grade{ font-size:16px; color:var(--muted); }
  .tv-podium .amount{ font-family:'JetBrains Mono',monospace; font-size:24px; color:var(--gold); }
  .tv-podium .p1{ order:2; } .tv-podium .p2{ order:1; } .tv-podium .p3{ order:3; }
  .tv-podium .p1 .medal{ font-size:88px; }

  .tv-cd{ display:flex; justify-content:center; gap:36px; flex-wrap:wrap; }
  .tv-cd .n{ font-family:'Russo One',sans-serif; font-size:80px; color:var(--gold); background:var(--card-2); border:1px solid var(--line); border-radius:14px; padding:16px 30px; min-width:120px; }
  .tv-cd .l{ font-family:'Barlow Condensed',sans-serif; font-size:15px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-top:10px; }

  .tv-table{ width:100%; font-size:22px; border-collapse:collapse; }
  .tv-table th{ font-family:'Barlow Condensed',sans-serif; color:var(--gold); font-size:14px; letter-spacing:2px; padding:10px; border-bottom:1px dashed var(--line); }
  .tv-table td{ padding:14px 10px; border-bottom:1px solid rgba(60,110,170,.28); }
  .tv-table .amt{ color:var(--gold); font-family:'JetBrains Mono',monospace; }

  .tv-quota-row{ display:flex; align-items:center; gap:16px; margin-bottom:16px; text-align:left; }
  .tv-quota-row .name{ width:220px; font-size:20px; flex-shrink:0; }
  .tv-quota-bar{ flex:1; height:20px; background:var(--bg-1); border:1px solid var(--line); border-radius:20px; overflow:hidden; }
  .tv-quota-bar .fill{ height:100%; background:linear-gradient(90deg, var(--sunset-2), var(--gold)); }
  .tv-quota-row .pct{ width:60px; font-family:'JetBrains Mono',monospace; color:var(--gold); flex-shrink:0; }

  .tv-dots{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:50; }
  .tv-dots span{ width:10px; height:10px; border-radius:50%; background:var(--line); }
  .tv-dots span.active{ background:var(--gold); }

  .tv-capitaine{ font-family:'Russo One',sans-serif; font-size:56px; color:var(--gold); }
</style>
</head>
<body class="login-body">

<button class="ghost tv-fullscreen" id="btn-full">⛶ Plein écran</button>
<a class="ghost tv-exit" href="dashboard.html">✕ Quitter</a>

<div class="tv-wrap">

  <div class="tv-slide active" data-slide="intro">
    <img src="../img/logo.png" alt="Morosov" class="tv-logo">
    <div class="tv-title">MOROSOV</div>
    <div class="tv-sub">ORGANISATION</div>
  </div>

  <div class="tv-slide" data-slide="podium">
    <div class="tv-h">🏆 Top 3 de la semaine</div>
    <div class="tv-podium" id="tv-podium"></div>
  </div>

  <div class="tv-slide" data-slide="countdown">
    <div class="tv-h">⏳ Fin de semaine</div>
    <div class="tv-cd" id="tv-countdown"></div>
  </div>

  <div class="tv-slide" data-slide="classement">
    <div class="tv-h">Classement des membres</div>
    <table class="tv-table"><thead><tr><th>Membre</th><th>Grade</th><th>Part due</th></tr></thead><tbody id="tv-classement"></tbody></table>
  </div>

  <div class="tv-slide" data-slide="quotas">
    <div class="tv-h">💵 Cotisation de la semaine</div>
    <div id="tv-quotas"></div>
  </div>

  <div class="tv-slide" data-slide="capitaine">
    <div class="tv-h">❄️ Membre du jour</div>
    <div class="tv-capitaine" id="tv-capitaine"></div>
  </div>

</div>

<div class="tv-dots" id="tv-dots"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
  const membre = requireSession();
  if (membre) {
    startSnow();
    const SLIDES = ['intro', 'podium', 'countdown', 'classement', 'quotas', 'capitaine'];
    let slideIndex = 0;

    document.getElementById('tv-dots').innerHTML = SLIDES.map((s, i) =>
      `<span class="${i === 0 ? 'active' : ''}" data-i="${i}"></span>`).join('');

    function showSlide(i) {
      slideIndex = i;
      document.querySelectorAll('.tv-slide').forEach(el => el.classList.toggle('active', el.dataset.slide === SLIDES[i]));
      document.querySelectorAll('.tv-dots span').forEach((el, idx) => el.classList.toggle('active', idx === i));
    }
    function nextSlide() { showSlide((slideIndex + 1) % SLIDES.length); }
    setInterval(nextSlide, 8000);

    document.getElementById('btn-full').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    });

    // ---- Countdown (indépendant, live) ----
    async function demarrerCountdown() {
      const activeId = (await db.ref('config/semaine_active_id').get()).val();
      if (!activeId) return;
      const semaine = (await db.ref('semaines/' + activeId).get()).val();
      if (!semaine || !semaine.fin) return;
      const cible = new Date(semaine.fin).getTime();
      function tick() {
        const diff = cible - Date.now();
        const el = document.getElementById('tv-countdown');
        if (diff <= 0) { el.innerHTML = `<div><div class="n">❄️</div><div class="l">Nouvelle semaine</div></div>`; return; }
        const j = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.innerHTML = `
          <div><div class="n">${j}</div><div class="l">Jours</div></div>
          <div><div class="n">${String(h).padStart(2,'0')}</div><div class="l">Heures</div></div>
          <div><div class="n">${String(m).padStart(2,'0')}</div><div class="l">Minutes</div></div>
          <div><div class="n">${String(s).padStart(2,'0')}</div><div class="l">Secondes</div></div>`;
      }
      tick();
      setInterval(tick, 1000);
    }
    demarrerCountdown();

    // ---- Données principales (rafraîchies toutes les 60s) ----
    async function chargerDonnees() {
      const [mSnap, aSnap, lSnap, rSnap, vSnap, cSnap] = await Promise.all([
        db.ref('membres').get(),
        db.ref('actions').get(),
        db.ref('labos').get(),
        db.ref('recoltes').get(),
        db.ref('ventes').get(),
        db.ref('config').get()
      ]);
      const membres = Object.fromEntries(entries(mSnap.val()));
      const cfg = getConfig(cSnap.val());
      const activeWeekId = cSnap.val() && cSnap.val().semaine_active_id;
      const actions = entries(aSnap.val()).filter(([,a]) => a.resultat !== 'Échec');
      const labos = entries(lSnap.val()).filter(([,l]) => l.resultat !== 'Échec');
      const recoltes = entries(rSnap.val());
      const ventes = entries(vSnap.val()).filter(([,v]) => v.resultat !== 'Échec');

      // Part due — toutes semaines confondues (classement) + semaine active (podium)
      const partTotal = {}, partSemaine = {}, cotisationSemaine = {};
      const addPart = (list, kind) => list.forEach(([, item]) => {
        const part = partMembre(cfg, kind, item);
        partTotal[item.membre_id] = (partTotal[item.membre_id] || 0) + part;
        if (item.semaine_id === activeWeekId) partSemaine[item.membre_id] = (partSemaine[item.membre_id] || 0) + part;
      });
      addPart(actions, 'actions'); addPart(labos, 'labos'); addPart(recoltes, 'recoltes'); addPart(ventes, 'ventes');
      actions.forEach(([, a]) => { if (a.semaine_id === activeWeekId) cotisationSemaine[a.membre_id] = (cotisationSemaine[a.membre_id] || 0) + (a.montant || 0); });

      const actifs = Object.entries(membres).filter(([id, m]) => m.actif !== false && !m.invisible);

      // Classement (all-time)
      const classement = actifs
        .map(([id, m]) => ({ id, m, total: partTotal[id] || 0 }))
        .sort((a, b) => b.total - a.total);
      document.getElementById('tv-classement').innerHTML = classement.slice(0, 8).map(r => {
        const g = gradeInfo(r.m.grade);
        return `<tr><td>${r.m.prenom}</td><td>${g.emoji} ${g.nom}</td><td class="amt">${fmtMoney(r.total)}</td></tr>`;
      }).join('') || `<tr><td colspan="3">Aucune activité pour le moment.</td></tr>`;

      // Podium (semaine active)
      const podium = actifs
        .map(([id, m]) => ({ id, m, total: partSemaine[id] || 0 }))
        .sort((a, b) => b.total - a.total)
        .slice(0, 3);
      const medailles = ['🥇', '🥈', '🥉'];
      document.getElementById('tv-podium').innerHTML = podium.length === 0
        ? `<div style="font-size:22px;color:var(--muted);">Aucune activité cette semaine.</div>`
        : podium.map((r, i) => `
            <div class="p p${i + 1}">
              <div class="medal">${medailles[i]}</div>
              <div class="name">${r.m.prenom}</div>
              <div class="grade">${gradeInfo(r.m.grade).emoji} ${gradeInfo(r.m.grade).nom}</div>
              <div class="amount">${fmtMoney(r.total)}</div>
            </div>`).join('');

      // Cotisation (montant des actions, semaine active)
      const cible = cfg.quotas.cotisation || 0;
      document.getElementById('tv-quotas').innerHTML = cible <= 0
        ? `<div style="font-size:20px;color:var(--muted);">Aucun objectif configuré (Admin → Quotas).</div>`
        : actifs.map(([id, m]) => {
            const fait = cotisationSemaine[id] || 0;
            const pct = Math.min(100, Math.round(fait / cible * 100));
            return `<div class="tv-quota-row">
              <div class="name">${gradeInfo(m.grade).emoji} ${m.prenom}</div>
              <div class="tv-quota-bar"><div class="fill" style="width:${pct}%;"></div></div>
              <div class="pct" style="width:170px;">${fmtMoney(fait)} / ${fmtMoney(cible)}</div>
            </div>`;
          }).join('');

      // Membre du jour
      const capitaine = capitaineDuJour(actifs);
      document.getElementById('tv-capitaine').textContent = capitaine ? `${capitaine[1].prenom} ${gradeInfo(capitaine[1].grade).emoji}` : '—';
    }

    chargerDonnees();
    setInterval(chargerDonnees, 60000);
  }
</script>
</body>
</html>
